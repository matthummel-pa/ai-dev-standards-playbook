    <rect x="468" y="200" width="116" height="34" rx="17" fill="none" stroke="#b45309" stroke-width="2"/><text x="526" y="222" text-anchor="middle">agents/</text>
    <rect x="596" y="200" width="176" height="34" rx="17" fill="none" stroke="#9aa4b2" stroke-width="2"/><text x="684" y="222" text-anchor="middle">templates/project</text>
  </g>
  <text x="64" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#9aa4b2">Install once · merge to main · every machine updates on its next session</text>
  <g transform="translate(960,48) scale(.85)" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
