    <path d="M90 30h60" marker-end="none"/><path d="M45 60v30h75v30" /><path d="M195 60v30h-75"/>
    <text x="45" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3" stroke="none">GitHub</text>
    <text x="195" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3" stroke="none">~/.claude</text>
    <text x="120" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3" stroke="none">Claude Code</text>
