    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width="1" opacity=".5"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0e1116"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#g)"/>
  <text x="64" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="46" font-weight="700" fill="#e6edf3">⚡ AI Dev Standards &amp; Playbook</text>
  <text x="64" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" fill="#9aa4b2">Rules, skills and commands that teach Claude Code how to build WordPress and front-end sites</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3">
    <rect x="64" y="200" width="116" height="34" rx="17" fill="none" stroke="#58a6ff" stroke-width="2"/><text x="122" y="222" text-anchor="middle">rules/</text>
    <rect x="192" y="200" width="116" height="34" rx="17" fill="none" stroke="#2dd4bf" stroke-width="2"/><text x="250" y="222" text-anchor="middle">skills/</text>
